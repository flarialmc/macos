name: macOS
# Stage 1 of a macOS release: build, sign and submit to Apple's notary service without waiting (a first-time or held submission can take
# days, longer than any runner job may run). The signed app and the submission id are parked on a draft release "mac-pending-<version>";
# macos-publish.yml polls Apple and publishes once the submission is accepted.
on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  build:
    if: github.repository == 'flarialmc/macos'
    runs-on: macos-15
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      MACOS_SIGN_IDENTITY: "Developer ID Application: Ashank Sundaram (8DM67J2F6Q)"
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Verify
        env:
          MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          if [ "${{ github.event_name }}" != "workflow_dispatch" ] && [[ "$MESSAGE" != 'release:'* ]]; then
            echo "Not a release commit, cancelling."
            gh run cancel "${{ github.run_id }}"
            gh run watch "${{ github.run_id }}"
            exit 0
          fi
          echo "A release commit, proceeding."

      - name: .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Bump
        run: |
          Version="$(date -u +%Y).$((10#$(date -u +%m))).$((10#$(date -u +%d))).$((10#$(date -u +%H%M)))"
          echo "$Version" > version.txt
          echo "VERSION=$Version" >> "$GITHUB_ENV"
          git config --global user.name "GitHub Actions Bot"
          git config --global user.email "actions@example.com"
          git add version.txt
          git commit -m "Version (macos) -> '$Version'"
          git push

      - name: Certificate
        env:
          CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
          CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
        run: tools/ci-import-cert-macos.sh

      - name: Build
        run: |
          tools/make-app-macos.sh publish
          test "$(cat publish/Flarial.app/Contents/Resources/version.txt)" = "$VERSION"

      - name: Submit
        env:
          NOTARY_KEY: ${{ secrets.NOTARY_KEY_P8 }}
          NOTARY_KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
          NOTARY_ISSUER: ${{ secrets.NOTARY_ISSUER_ID }}
        run: |
          printf '%s\n' "$NOTARY_KEY" > "$RUNNER_TEMP/notary.p8"
          ditto -c -k --keepParent publish/Flarial.app Flarial.app.zip
          ID="$(xcrun notarytool submit Flarial.app.zip --key "$RUNNER_TEMP/notary.p8" --key-id "$NOTARY_KEY_ID" --issuer "$NOTARY_ISSUER" --output-format json | jq -r .id)"
          rm -f "$RUNNER_TEMP/notary.p8"
          test -n "$ID" && test "$ID" != null
          echo "submission $ID"
          # newer pending releases replace older ones
          gh release list --json tagName,isDraft -q '.[]|select(.isDraft and (.tagName|startswith("mac-pending-")))|.tagName' | while read -r t; do gh release delete "$t" -y; done
          gh release create "mac-pending-$VERSION" Flarial.app.zip --draft --title "macOS $VERSION (waiting for notarization)" --notes "$ID"
          gh workflow run macos-publish.yml --ref main
